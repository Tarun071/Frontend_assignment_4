<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to right, #081016, #071415f7);
        }

        h1{
            color: white;
            margin-bottom: 40px;
            font-size: 45px;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }

        div{
            margin: 15px 0;
        }

        a{
            text-decoration: none;
            background-color: white;
            color: black;
            padding: 15px 35px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            display: inline-block;
            transition: 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        a:hover{
            background-color: #3d0b0b;
            color: white;
            transform: scale(1.05);
        }
</style>

</head>
<body>
    <h1>Web Applications</h1>
    <div>
        <a href="/todo/index.html">ToDo Web app</a>
    </div>

    <div>
        <a href="/weather/index.html">Weather Web App</a>
    </div>
</body>
</html>
